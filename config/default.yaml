# Tinten-Gewicht nach Leuchtdichte/Saettigung: dunkle oder gesaettigte Tinte zaehlt voll
# (Schwarz, Gewerkefarben - auch vom Architekt), helle Grautoene nur reduziert.
ink:
  dark_lum: 0.45        # Leuchtdichte <= : Gewicht 1.0 (unabhaengig von der Saettigung)
  light_lum: 0.85       # Leuchtdichte >= : Gewicht 0.0 (Hintergrund/Flaeche)
  saturated: 0.25       # Saettigung (max-min) >= : gilt als Gewerkefarbe, Gewicht 1.0 bis 0.9 Lum.
  full_weight: 0.9      # ab diesem Gewicht = "dark" (voll)
  min_weight: 0.05      # darunter = "none"

# Texte des Architekten (nicht auf Rechtschreibung pruefen)
architect_text:
  layer_patterns: ["|"]     # Teilstrings; "|" = XREF-Ebene (z. B. "325_AVI_G1|_TEXT")
  max_weight: 0.6           # Textfarbe mit Gewicht darunter = Architekt (hellgrau)

# Plankopf/Legende (rechter Streifen): automatisch ueber "Legende*"-Ankertexte, sonst Fallback
title_block:
  anchor_regex: "^\\s*Legende"
  margin: 0.01              # Anteil der Seitenbreite links vom Anker
  fallback_rect: [0.85, 0.0, 1.0, 1.0]   # Anteile (x0,y0,x1,y1), sichtbarer Raum, links oben

overlap:
  warn_pct: 10                # Anteil kontrastarmer Glyphenpixel (%)
  error_pct: 25
  contrast_min: 0.30          # |Leuchtdichte Hintergrund - Textfarbe| darunter = nicht lesbar
  min_text_weight: 0.6        # Texte heller als dieses Tinten-Gewicht werden nicht geprueft
  min_glyph_px: 15
  covered_delta: 90           # max. Kanalabweichung sichtbar vs. Textfarbe: darueber = Pixel verdeckt
  text_text_warn_pct: 20      # Boxueberlappung relativ zur kleineren Box
  text_text_error_pct: 50

markup:
  colors: {overlap: [1.0, 0.55, 0.0], spelling: [0.0, 0.72, 0.83], consistency: [1.0, 0.77, 0.0]}
